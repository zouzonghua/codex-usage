name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package check
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Verify app packaging
        env:
          ARTIFACT_LABEL: ci
          DIST_DIR: ${{ runner.temp }}/codex-package
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build -c release --show-bin-path)" ./Scripts/package_app.sh
          test -f "$DIST_DIR/CodexUsage-ci.dmg"
